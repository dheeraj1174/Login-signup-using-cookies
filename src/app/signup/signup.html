<div class="auth-container">
  <div class="auth-box">
    <h2>Create Account</h2>

    <!-- ERROR -->
    <p class="error-msg" *ngIf="error">{{ error }}</p>

    <!-- SUCCESS -->
    <div class="success-alert" *ngIf="message">
      <span class="success-icon">✔</span>
      <p>{{ message }}</p>
    </div>

    <form (ngSubmit)="onSignup()" #signupForm="ngForm">

      <!-- USERNAME -->
      <div class="form-group">
        <label>Username</label>
        <input
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Enter username"
          required
        />
      </div>

      <!-- EMAIL -->
      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter email"
          required
          email
          #emailCtrl="ngModel"
        />
        
        <small class="validation-error"
          *ngIf="emailCtrl.invalid && (emailCtrl.touched || signupForm.submitted)">
          <span *ngIf="emailCtrl.errors?.['required']">
            Email is required
          </span>
          <span *ngIf="emailCtrl.errors?.['email']">
            Please enter a valid email (example@gmail.com)
          </span>
        </small>
      </div>

      <!-- PASSWORD -->
      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter password"
          required
          minlength="6"
        />
      </div>

      <!-- CONFIRM PASSWORD -->
      <div class="form-group">
        <label>Confirm Password</label>
        <input
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Confirm password"
          required
        />
      </div>

      <button type="submit" class="btn-primary" [disabled]="signupForm.invalid">
        Sign Up
      </button>

      <p class="switch-text">
        Already have an account?
        <a routerLink="/login">Login</a>
      </p>

    </form>
  </div>
</div>
