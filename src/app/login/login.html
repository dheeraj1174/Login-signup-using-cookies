<div class="auth-container">
    <div class="auth-box">
        <h2>Welcome Back</h2>
        <span class="subtitle">Please enter your details to sign in</span>

        <div *ngIf="error" class="error-msg">{{ error }}</div>

        <form (ngSubmit)="onLogin()" #loginForm="ngForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required email [(ngModel)]="email" name="email"
                    placeholder="Enter your email" required #emailModel="ngModel" />
                <small class="validation-error" *ngIf="emailModel.errors?.['required'] && emailModel.touched">
                    Email is required
                </small>


            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" [(ngModel)]="password" name="password"
                    placeholder="Enter your password" required #passwordModel="ngModel" minlength="6" />
                <small class="validation-error" *ngIf="passwordModel.invalid && passwordModel.touched">
                    Minimum 6 characters
                </small>
            </div>

            <button type="submit" [disabled]="loginForm.invalid">Login</button>
        </form>

        <p class="switch-text">
            Don't have an account?
            <a routerLink="/signup">Sign up</a>
        </p>
    </div>
</div>
